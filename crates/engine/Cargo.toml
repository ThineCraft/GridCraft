[package]
name = "gridcraft-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GridCraft engine: sessions, commands, history, clipboard, fill, sort, filter"

[lints]
workspace = true

[dependencies]
collab-core = { path = "../../../ShareCraft/crates/collab-core" }
collab-live = { path = "../../../ShareCraft/crates/collab-live" }
gridcraft-core = { workspace = true }
gridcraft-numfmt = { workspace = true }
gridcraft-formula = { workspace = true }
gridcraft-functions = { workspace = true }
gridcraft-model = { workspace = true }
gridcraft-calc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
web-time = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
gridcraft-xlsx = { workspace = true }
gridcraft-chart = { workspace = true }
gridcraft-pdf = { workspace = true }
gridcraft-math = { workspace = true }
image = { workspace = true }
sha2 = { workspace = true }
protocol = { path = "../../../ShareCraft/crates/protocol" }

[dev-dependencies]
gridcraft-xlsx = { workspace = true, features = ["test-support"] }
zip = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
# Node-hosted browser-engine parity tests. MIT OR Apache-2.0.
# 0.3.79 uses wasm-bindgen 0.2.129, matching this workspace's locked version.
# Test-only crates it adds: wasm-bindgen-test-macro and wasm-bindgen-test-shared
# (MIT OR Apache-2.0), cast (MIT OR Apache-2.0), minicov (MIT OR Apache-2.0, only
# under an unstable coverage cfg), nu-ansi-term (MIT), oorandom (MIT).
wasm-bindgen-test = "=0.3.79"
